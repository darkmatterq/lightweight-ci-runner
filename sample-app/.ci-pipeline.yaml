name: Sample App Pipeline

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.12-slim
  timeout: 30
  commands: 
  - pip install flake8
  - flake8 sample-app/
test:
  stage: test
  image: python:3.12-slim
  timeout: 60
  commands:
    - pip install pytest
    - pytest sample-app/test_app.py
build:
  stage: build
  image: docker:cli
  timeout: 60
  commands:
    - docker build -t sample-app:latest sample-app/

  
    
